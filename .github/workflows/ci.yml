name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install CPU audio test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Sync locked development environment
        run: uv sync --frozen
      - name: Repository admission and Markdown resources
        run: uv run --frozen python -m scripts.check_repository
      - name: Install pinned credential scanner
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Credential scan with bounded redacted output
        run: |
          uv run --frozen python -m scripts.check_secrets --gitleaks "$RUNNER_TEMP/gitleaks"
          uv run --frozen python -m scripts.check_secrets --gitleaks "$RUNNER_TEMP/gitleaks" --ref HEAD
      - name: Release dependency constraints and immutable source pins
        run: uv run --frozen python -m scripts.check_release_dependencies
      - name: Unit and API tests
        run: uv run --frozen pytest -q
      - name: Static type checks
        run: uv run --frozen mypy asr_server asr_mcp tests scripts
      - name: Build locked frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
