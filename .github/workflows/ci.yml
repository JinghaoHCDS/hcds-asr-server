name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --frozen
      - name: Release dependency constraints and immutable source pins
        run: uv run --frozen python -m scripts.check_release_dependencies
      - name: Unit and API tests
        run: uv run --frozen pytest -q
      - name: Static type checks
        run: uv run --frozen mypy asr_server asr_mcp tests scripts
