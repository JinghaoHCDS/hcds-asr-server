[project]
name = "asr-server"
version = "0.1.0"
description = "LAN ASR service for Agents, powered by Qwen3-ASR and MOSS on NVIDIA GPUs in Windows WSL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.27,<2",
]

[dependency-groups]
dev = [
    "mcp>=1.27,<2",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "rapidfuzz>=3.9,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: local API, persistence or worker integration behavior (included by default)",
    "gpu: explicitly configured real GPU validation",
    "performance: opt-in measurements without ordinary timing assertions",
    "release: source/dependency/artifact release validation",
]

[tool.mypy]
python_version = "3.12"
plugins = []
strict = true
warn_unreachable = true
